# Encore Bridge on Docker, from prebuilt images. Linux hosts (64-bit x86 or ARM) with Docker Compose v2 or newer.
# Docs: https://github.com/mbucc9000/encore (docs/TUTORIAL-DOCKER.md)
#
# Start: put this file in an empty folder as compose.yaml, run  docker compose up -d  there, then open
#        http://<this computer's address>:8095/admin: the setup guide does the rest. Its first step asks for the
#        setup code:  docker compose logs gateway | grep "setup code"
#        Dockge or Portainer: paste this file into a new stack and deploy it. Portainer: change ./data, ./engine
#        and ./pipe to full paths (for example /opt/encore/data) so your data stays in a folder you know.
# Update: docker compose pull && docker compose up -d   (Dockge: Update. Portainer: Update the stack with
#        Re-pull image and redeploy.)
# Both services use host networking: Spotify Connect discovery reaches your network and the admin page sees each
# phone's real address (Docker Desktop on Windows or macOS can't do either).
# Settings: none are needed. Optional ones go into a .env file next to this file (Dockge: the stack's .env box;
# Portainer: the stack's environment variables), then  docker compose up -d :
#   ENCORE_TAG        a version to stay on, such as v1.3.0 or 1.3 (default: latest)
#   ZEROCONF_BACKEND  avahi on hosts that run avahi-daemon (many NAS systems); also remove the # in front of the
#                     dbus line at the end of this file
#   SPOTIFY_CLIENT_ID, ADMIN_PASSWORD, ADMIN_ALLOW, UPDATE_CHECK: see the guide's "Bridge settings"
# Folders next to this file: data/ (pairings, sign-ins, the admin password, settings, caches), engine/ (the engine's
# config.yml, written at the first start, and its sign-in), pipe/ (the audio between the two containers).
services:
  gateway:
    image: ghcr.io/mbucc9000/encore-bridge:${ENCORE_TAG:-latest}
    container_name: encore-gateway
    network_mode: host
    restart: unless-stopped
    environment:
      PORT: "8095"
      DATA_DIR: /data
      PCM_FIFO: /pipe/encore.pcm
      ENGINE_URL: http://127.0.0.1:3678
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_ALLOW: ${ADMIN_ALLOW:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-}
    volumes:
      - ./data:/data
      - ./pipe:/pipe

  engine:
    image: ghcr.io/mbucc9000/encore-engine:${ENCORE_TAG:-latest}
    container_name: encore-engine
    network_mode: host
    restart: unless-stopped
    depends_on: [gateway]
    environment:
      ZEROCONF_BACKEND: ${ZEROCONF_BACKEND:-}
    volumes:
      - ./engine:/config
      - ./pipe:/pipe
      # Only with ZEROCONF_BACKEND=avahi:
      # - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
