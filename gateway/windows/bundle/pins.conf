# Third-party programs in the Windows bundle, pinned by version and SHA-256 (D20, D21). bundle.sh refuses a download
# (or a build) whose hash differs. To update one: change all of its lines together, after checking the new hash against
# the publisher's own list (Node.js: SHASUMS256.txt, which the release key signs; FFmpeg: the release tarball whose
# signature verifies, see build-ffmpeg/README.md). Sourced by bundle.sh (plain KEY=VALUE, no spaces). It is named
# .conf, not .env, because the release export never ships *.env files.

# Node.js 22 LTS ("Jod"), the official signed Windows build: the same major version as the Docker image
# (node:22-bookworm-slim). Only node.exe and its LICENSE are taken from the zip.
NODE_VERSION=22.23.3
NODE_ZIP_URL=https://nodejs.org/dist/v22.23.3/node-v22.23.3-win-x64.zip
NODE_ZIP_SHA256=2b0ff57b049cda1bbcea2240eec20467018713c1efe1f7360c2681859b90ed71
# win-x64/node.exe in https://nodejs.org/dist/v22.23.3/SHASUMS256.txt: the node.exe inside the zip must match it
NODE_EXE_SHA256=9c9245166b4a8e182e0b797da9c20136117ff24368eaff1fec8343a123c8db0e

# FFmpeg: Encore's own minimal LGPL build (gateway/windows/build-ffmpeg, RELEASE-PLAN D21) of the FFmpeg 8.1.3 release
# tarball, with only the parts the bridge uses and zlib as its one library, so its complete source is that tarball (it
# ships in the GPL source bundle). bundle.sh takes ffmpeg.exe from --ffmpeg (that build's output folder) and checks the
# build against these lines: the version and the tarball's SHA-256 (the same as build-ffmpeg/Dockerfile's).
FFMPEG_VERSION=8.1.3
FFMPEG_SOURCE_SHA256=7138d28c96d9d3e3af4ee3d8cad72741f8ffb40da90c1112235dea3ecd3178a3
